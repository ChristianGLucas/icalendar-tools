name: christiangeorgelucas/icalendar-tools
version: 0.1.3
language: java
description: >-
  Composable Axiom iCalendar (RFC 5545) CALENDAR-FILE nodes — parse a whole
  .ics VCALENDAR document into structured VEVENTs/VTODOs/VJOURNALs (summary,
  start/end, location, organizer/attendees, status, UID, RRULE string,
  VALARMs, categories), build a valid .ics document back from that same
  structure, validate a .ics document against the spec, list/filter the
  VEVENTs in a calendar, and expand a calendar's recurring VEVENTs (RRULE +
  RDATE + EXDATE together) into concrete occurrences within a caller-supplied
  window — over a single ICalCalendar envelope, wrapping the BSD-3-Clause
  reference JVM library ical4j. Offline, deterministic, and distinct from
  christiangeorgelucas/recurrence-tools, which expands a single bare RRULE
  string rather than parsing/building whole calendar files.
author: Christian George Lucas
license: MIT
tags:
    - icalendar
    - ics
    - calendar
    - rfc5545
    - vevent
    - vtodo
    - vjournal
    - scheduling
nodes:
    - name: ParseICalendar
      input: ICalTextInput
      output: ICalCalendar
      description: >-
        Parse a .ics VCALENDAR document into a structured ICalCalendar: every
        VEVENT, VTODO, and VJOURNAL with its fields (summary, start/end,
        location, organizer/attendees, status, UID, RRULE string,
        RECURRENCE-ID, VALARMs, categories, ...), plus
        PRODID/VERSION/CALSCALE/METHOD. An override VEVENT — one that edits a
        single instance of a recurring series — is identified by a non-empty
        `recurrence_id` naming the instant it replaces, with
        `recurrence_id_range` carrying RANGE=THISANDFUTURE. Malformed input
        (not iCalendar at all, or too large) returns a structured error rather
        than crashing; individual malformed components are preserved as-is
        (e.g. a missing UID comes back as an empty uid field) rather than
        silently dropped, so downstream nodes see exactly what the file
        contained. Input capped at 2 MiB.
    - name: BuildICalendar
      input: ICalCalendar
      output: ICalTextOutput
      description: >-
        Generate a valid, RFC 5545-folded .ics VCALENDAR document from a
        structured ICalCalendar (events/todos/journals) — the reverse of
        ParseICalendar; Parse(Build(x)) round-trips every field this package
        models, on VEVENTs, VTODOs and VJOURNALs alike — including
        RECURRENCE-ID with its TZID and RANGE, so a rebuilt calendar still
        expands to the same occurrences and an edited instance does not
        silently become a second, duplicate meeting. Properties the
        ICalCalendar envelope does not model (DURATION, EXRULE, ATTACH, GEO,
        RELATED-TO, X- extensions) are not preserved. The deprecated
        RANGE=THISANDPRIOR, which RFC 5545 §3.2.13 says MUST NOT be generated,
        is DROPPED rather than emitted — and rather than failing the whole
        calendar, so a legacy RFC 2445 document still round-trips. An absent
        RANGE means the same thing ExpandOccurrences already reads
        THISANDPRIOR as: this single instance only. Fills a
        default PRODID/VERSION when the caller leaves them empty. Rejects a
        calendar with zero components, or a component missing its required
        UID, with a structured error rather than emitting invalid iCalendar.
        Deterministic: DTSTAMP is emitted only when the caller supplies one —
        this node never fills it from the wall clock, so the same input
        always produces byte-identical output.
    - name: ValidateICalendar
      input: ICalTextInput
      output: ICalValidationResult
      description: >-
        Validate a .ics document against RFC 5545: reports valid=false with
        one entry per problem (a parse failure, or a validation rule broken
        on some component — e.g. a VEVENT missing its required UID or
        DTSTAMP) rather than throwing. valid=true means the document both
        parses and passes ical4j's RFC 5545 component validation.
    - name: ListEvents
      input: ICalListEventsInput
      output: ICalEventList
      description: >-
        List the VEVENTs in a .ics document, optionally filtered by exact
        (case-insensitive) category or by overlap with a [window_start,
        window_end) instant window — leave both filters empty to list every
        VEVENT. Each event carries `recurrence_id` (non-empty only on an
        override VEVENT that replaces one instance of a recurring series) and
        `status`, so a caller can tell which instances were individually
        edited or cancelled. Distinct from ParseICalendar: this returns only
        VEVENTs (never VTODO/VJOURNAL) and supports server-side filtering
        instead of
        the caller filtering the full parse result themselves.
    - name: ExpandOccurrences
      input: ICalExpandInput
      output: ICalOccurrenceList
      description: >-
        Expand every VEVENT in a .ics document — combining its RRULE, RDATE,
        and EXDATE together per RFC 5545 §3.8.5, honouring RECURRENCE-ID
        overrides per §3.8.4.4, and passing non-recurring VEVENTs through
        unchanged — into concrete occurrences that fall inside a
        caller-supplied [window_start, window_end) instant window, earliest
        first. When a calendar owner edits ONE instance of a recurring series
        (what Google Calendar and Outlook emit whenever someone drags a single
        meeting), that override REPLACES the master's instance rather than
        adding to it: the overridden instant is subtracted from the expansion,
        so a moved or cancelled instance leaves its original slot genuinely
        free instead of reporting it as still busy. Each occurrence carries
        `recurrence_id` (the slot it replaced), `is_override`, and `status`.
        Instances cancelled with STATUS:CANCELLED are omitted by default —
        set `include_cancelled` to receive them. RANGE=THISANDFUTURE is
        honoured per RFC 5545 §3.8.4.4: the override's own instance and every
        later one are rescheduled by the same time difference AND take the
        override's duration. Note the window filter is an OVERLAP filter, and
        an occurrence of a RECURRING VEVENT that merely touches a bound is
        returned (a non-recurring one in the same position is not) — if you
        are computing free/busy, treat a touching occurrence as
        non-conflicting yourself. Not implemented: an override VEVENT that
        carries its OWN RRULE (the RFC 5546 way to express a recurrence-RULE
        change rather than a reschedule) is treated as a plain single-instance
        override; its rule is not applied to the series.
        Complementary to christiangeorgelucas/recurrence-tools (which expands
        one bare RRULE string you supply yourself): this operates on every
        recurring VEVENT already inside a whole calendar file at once. Capped
        at `limit` occurrences total (default 500, max 5000); a dense window
        flags truncated=true instead of running unbounded.
build:
    maven_deps:
        - org.mnode.ical4j:ical4j:3.2.19
